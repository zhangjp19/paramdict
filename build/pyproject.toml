[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paramdict"
version = "1.0.2"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "zhangjp19", email = "asamatteroffact@yeah.net" }
]
description = "A lightweight wrapper around Python dictionary."

[project.urls]
Documentation = "https://paramdict-docs.readthedocs.io/en/latest/"
Repository = "https://github.com/zhangjp19/paramdict"
Issues = "https://github.com/zhangjp19/paramdict/issues"

[tool.setuptools.packages.find]
exclude = ["*.sh"]
